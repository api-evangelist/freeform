name: Freeform
description: 'Freeform is an AI-native advanced manufacturing company founded by former SpaceX
  engineers, building a network of autonomous factories that sense, learn, predict, and control
  metal formation for high-performance metal additive manufacturing (metal 3D printing). Freeform
  integrates hardware, sensors, controls, and software to move parts from prototype to full-scale
  production for aerospace, defense, aviation, advanced energy, consumer electronics, and automotive
  customers. It is a physical-AI / advanced-manufacturing business rather than a software API platform,
  so as of this profile it exposes no public developer API, SDKs, or developer documentation.'
